name: nexus-ti

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d nexus']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  api:
    build: { context: ., target: api }
    environment:
      DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      API_URL: http://localhost:4000
      PUBLIC_URL: http://localhost:3000
      SEED_DEMO: 'true'
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  office:
    build:
      context: .
      target: office
      args: { NEXT_PUBLIC_API_URL: http://localhost:4000 }
    ports: ['3000:3000']
    depends_on: [api]

volumes:
  pgdata:
