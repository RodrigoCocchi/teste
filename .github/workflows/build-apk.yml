name: Build APK

on:
  push:
    branches: [ccr-a717e1c3-dutbli, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Verificar download das fontes (online)
        continue-on-error: true
        env:
          ONLINE_CHECK: '1'
        run: flutter test tool/source_check_test.dart --reporter expanded 2>&1 | grep -E "\[fonte\]|\[biblia\]|\[hinario\]|Exception|Falha|Não|erro|failed|passed" || true
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi
      - name: Empacotar alternativas de download
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk biblia-hinos-arm64.apk
          zip -9 biblia-hinos-apk.zip app-release.apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir o app num emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: biblia-hinos-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/biblia-hinos-arm64.apk
      - name: Publicar release para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Bíblia & Hinos CCB — APK
          prerelease: true
          make_latest: false
          body: |
            APK gerado automaticamente a partir do commit ${{ github.sha }}.
            - **biblia-hinos-arm64.apk**: menor, para celulares atuais (recomendado).
            - **app-release.apk**: universal.
            - **biblia-hinos-apk.zip**: o APK universal dentro de um .zip (use se o navegador travar no download do .apk).
          files: |
            build/app/outputs/flutter-apk/biblia-hinos-arm64.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/biblia-hinos-apk.zip
