name: Build APK

on:
  push:
    branches: [ccr-a717e1c3-dutbli, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi
      - name: Empacotar alternativas de download
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk biblia-hinos-arm64.apk
          zip -9 biblia-hinos-apk.zip app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: biblia-hinos-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/biblia-hinos-arm64.apk
      - name: Publicar release para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Bíblia & Hinos CCB — APK
          prerelease: true
          make_latest: false
          body: |
            APK gerado automaticamente a partir do commit ${{ github.sha }}.
            - **biblia-hinos-arm64.apk**: menor, para celulares atuais (recomendado).
            - **app-release.apk**: universal.
            - **biblia-hinos-apk.zip**: o APK universal dentro de um .zip (use se o navegador travar no download do .apk).
          files: |
            build/app/outputs/flutter-apk/biblia-hinos-arm64.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/biblia-hinos-apk.zip
