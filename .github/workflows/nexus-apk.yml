name: Nexus TI — APK

on:
  push:
    branches: [ccr-51556f96-kituag, main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: write

# Só a versão mais nova importa: um push novo cancela a compilação anterior.
concurrency:
  group: nexus-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Sem URL da API o app roda em modo demo local (simulação no próprio celular).
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXUS_VERSION_CODE: ${{ github.run_number }}
      NEXUS_VERSION_NAME: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=@nexus/office...
      - run: pnpm turbo run build --filter=@nexus/office...
      - run: pnpm --filter @nexus/office exec cap sync android

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/nexus.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"
          else
            # Sem o segredo, gera uma chave temporária: o APK instala, mas para atualizar
            # por cima de uma versão anterior é preciso desinstalar antes (ver INSTALAR-NEXUS.md).
            PASS=nexus-ci-temp
            keytool -genkeypair -keystore "$KS" -alias nexus -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Nexus TI"
          fi
          {
            echo "NEXUS_KEYSTORE_FILE=$KS"
            echo "NEXUS_KEYSTORE_PASSWORD=$PASS"
            echo "NEXUS_KEY_PASSWORD=$PASS"
            echo "NEXUS_KEY_ALIAS=nexus"
          } >> "$GITHUB_ENV"

      - name: Gerar APK
        working-directory: apps/office/android
        run: |
          ./gradlew --no-daemon assembleRelease
          cd app/build/outputs/apk/release
          cp app-release.apk nexus-ti.apk
          zip -9 nexus-ti-apk.zip nexus-ti.apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir o app num emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/nexus-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-smoke-test
          path: smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-ti-apk
          path: apps/office/android/app/build/outputs/apk/release/nexus-ti.apk
      - name: Publicar release para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-apk-latest
          target_commitish: ${{ github.sha }}
          name: Nexus TI — APK
          prerelease: true
          make_latest: false
          body: |
            APK gerado automaticamente a partir do commit ${{ github.sha }} (versão 0.2.${{ github.run_number }}).
            - **nexus-ti.apk**: instale direto no celular.
            - **nexus-ti-apk.zip**: o mesmo APK dentro de um .zip (use se o navegador travar no download do .apk).
            Como instalar: veja INSTALAR-NEXUS.md no repositório.
          files: |
            apps/office/android/app/build/outputs/apk/release/nexus-ti.apk
            apps/office/android/app/build/outputs/apk/release/nexus-ti-apk.zip
