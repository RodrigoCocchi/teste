<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: sans-serif; margin: 0; padding: 10px; background: #f7f2e7; color: #1c2541; }
  #alvo { font-size: 20px; font-weight: bold; padding: 10px 12px; border-radius: 12px; background: #e3ecff;
          border: 2px solid #1351b4; color: #1351b4; display: none; max-width: 40%; word-wrap: break-word; }
  #dica { font-size: 14px; color: #666; max-width: 40%; }
</style>
</head><body>
<p id="dica">Escreva acima e toque em <b>Mostrar em Libras</b>.</p>
<p id="alvo"></p>
<script>
  function abrir() { try { window.VLibrasWidget && window.VLibrasWidget.open && window.VLibrasWidget.open(); } catch (e) {} }
  function sinalizar(alvo) {
    var root = document.getElementById('vlibras-app-root');
    if (!root || root.dataset.active !== 'true') { abrir(); setTimeout(function () { sinalizar(alvo); }, 1200); return; }
    alvo.click();
  }
  function mostrar(t) {
    var alvo = document.getElementById('alvo');
    document.getElementById('dica').style.display = 'none';
    alvo.textContent = t;
    alvo.style.display = 'block';
    sinalizar(alvo);
  }
  function falhou() { if (window.Status) Status.postMessage('erro'); }
</script>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js" onerror="falhou()"></script>
<script>
  try {
    new window.VLibras.Widget('https://vlibras.gov.br/app');
    setTimeout(abrir, 800);
    if (window.Status) Status.postMessage('ok');
  } catch (e) { falhou(); }
</script>
</body></html>
